name: Deploy to Vercel

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build
      env:
        NODE_OPTIONS: --max-old-space-size=4096
        
    - name: Check Vercel secrets
      id: check-secrets
      run: |
        if [[ -z "${{ secrets.VERCEL_TOKEN }}" || -z "${{ secrets.VERCEL_ORG_ID }}" || -z "${{ secrets.VERCEL_PROJECT_ID }}" ]]; then
          echo "vercel_configured=false" >> $GITHUB_OUTPUT
          echo "⚠️ Vercel secrets not configured. Skipping deployment."
        else
          echo "vercel_configured=true" >> $GITHUB_OUTPUT
          echo "✅ Vercel secrets configured. Proceeding with deployment."
        fi
        
    - name: Deploy to Vercel (Production)
      if: steps.check-secrets.outputs.vercel_configured == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-args: '--prod'
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        
    - name: Deploy to Vercel (Preview)
      if: steps.check-secrets.outputs.vercel_configured == 'true' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-args: '--no-wait'
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        
    - name: Deployment Status
      if: always()
      run: |
        if [[ "${{ steps.check-secrets.outputs.vercel_configured }}" == "false" ]]; then
          echo "🔧 To enable Vercel deployment, configure the following repository secrets:"
          echo "   - VERCEL_TOKEN"
          echo "   - VERCEL_ORG_ID" 
          echo "   - VERCEL_PROJECT_ID"
          echo "📖 See DEPLOYMENT.md for setup instructions."
        else
          echo "✅ Build completed successfully!"
          echo "🚀 Vercel deployment initiated."
        fi
